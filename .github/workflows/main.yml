name: Gerar APK VIG SECURITY

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable

      - name: Extrair projeto
        run: |
          mkdir -p projeto
          unzip -q "$(find . -maxdepth 1 -name '*.zip' | head -1)" -d projeto

      - name: Encontrar projeto Flutter
        run: |
          PROJECT_DIR=$(find projeto -name pubspec.yaml -exec dirname {} \; | head -1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Criar estrutura Android
        run: |
          cd "$PROJECT_DIR"
          flutter create . --platforms=android

      - name: Instalar dependências
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Gerar APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: VIG-SECURITY-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
